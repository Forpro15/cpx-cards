<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7a6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>CPX 말족 학습카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: fixed left rail (modes + CC index) | main stage. Study = card grid per CC; drills = one big card + 알았음/몰랐음. ECG-paper ground. */
:root {
  --bg: #fbf7f6;
  --grid: rgba(196, 72, 72, 0.06);
  --rail: #f6eeec;
  --card: #ffffff;
  --back: #fdf1ef;
  --fg: #2a1f21;
  --muted: #8a7376;
  --line: #ead9d7;
  --accent: #b8323a;
  --accent-soft: #f6dfdd;
  --ok: #2f7a55;
  --ok-soft: #dff0e6;
  --miss: #b8323a;
  --hl: #ffe08a;
  --star: #c2410c;
  --c-r: #d1242f;
  --c-b: #1f5fd1;
  --c-g: #1a7f45;
  --c-o: #c2610c;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1416; --grid: rgba(230, 110, 110, 0.06); --rail: #201819; --card: #241c1e; --back: #2e2124;
    --fg: #f1e6e7; --muted: #a8908f; --line: #3b2d30; --accent: #ef7178; --accent-soft: #3d2427;
    --ok: #6cc596; --ok-soft: #1f3529; --miss: #ef7178; --hl: #6b5310; --star: #fb923c; --c-r: #ff7b72; --c-b: #79a8ff; --c-g: #5fd38d; --c-o: #ffa657;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1416; --grid: rgba(230, 110, 110, 0.06); --rail: #201819; --card: #241c1e; --back: #2e2124;
  --fg: #f1e6e7; --muted: #a8908f; --line: #3b2d30; --accent: #ef7178; --accent-soft: #3d2427;
  --ok: #6cc596; --ok-soft: #1f3529; --miss: #ef7178; --hl: #6b5310; --star: #fb923c; --c-r: #ff7b72; --c-b: #79a8ff; --c-g: #5fd38d; --c-o: #ffa657;
  color-scheme: dark;
}

/* palettes: body[data-pal] overrides the base (ECG red) tokens */
body[data-pal="scrub"] { --bg:#f4f8f7; --grid:rgba(30,120,110,.06); --rail:#eaf2f0; --card:#ffffff; --back:#e8f5f2; --fg:#16292a; --muted:#68807e; --line:#d4e4e0; --accent:#0e7a6d; --accent-soft:#d2ebe5; --ok:#2f7a45; --ok-soft:#dcefe1; --miss:#c0392b; }
body[data-pal="navy"]  { --bg:#f5f6fa; --grid:rgba(47,75,184,.05); --rail:#eceef6; --card:#ffffff; --back:#eef1fb; --fg:#1b1f2e; --muted:#6f7590; --line:#dde1ee; --accent:#2f4bb8; --accent-soft:#dfe5f8; --ok:#2f7a55; --ok-soft:#dff0e6; --miss:#c0392b; }
body[data-pal="amber"] { --bg:#faf7f0; --grid:rgba(168,98,10,.06); --rail:#f3eee2; --card:#fffdf8; --back:#fbf1dc; --fg:#2a2418; --muted:#857a63; --line:#e8dfca; --accent:#a35d08; --accent-soft:#f5e3c2; --ok:#2f7a55; --ok-soft:#dff0e6; --miss:#b83228; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) body[data-pal="scrub"] { --bg:#101a19; --grid:rgba(90,200,180,.06); --rail:#142120; --card:#192726; --back:#1c302d; --fg:#e2efec; --muted:#88a29e; --line:#283b39; --accent:#4cc7b4; --accent-soft:#1e3a36; --ok:#6cc58a; --ok-soft:#1d3526; --miss:#f07a6e; --hl:#6b5310; --star:#fb923c; --c-r: #ff7b72; --c-b: #79a8ff; --c-g: #5fd38d; --c-o: #ffa657; }
  :root:not([data-theme="light"]) body[data-pal="navy"]  { --bg:#12141d; --grid:rgba(142,164,255,.05); --rail:#171a26; --card:#1c2030; --back:#222941; --fg:#e6e8f2; --muted:#9196ad; --line:#2d3247; --accent:#8ea4ff; --accent-soft:#283055; --ok:#6cc596; --ok-soft:#1f3529; --miss:#f07a6e; --hl:#6b5310; --star:#fb923c; --c-r: #ff7b72; --c-b: #79a8ff; --c-g: #5fd38d; --c-o: #ffa657; }
  :root:not([data-theme="light"]) body[data-pal="amber"] { --bg:#18150f; --grid:rgba(240,165,74,.05); --rail:#1e1a13; --card:#241f17; --back:#2f271a; --fg:#f1ead9; --muted:#a89c82; --line:#3a3224; --accent:#f0a54a; --accent-soft:#3d3020; --ok:#6cc596; --ok-soft:#1f3529; --miss:#f07a6e; --hl:#6b5310; --star:#fb923c; --c-r: #ff7b72; --c-b: #79a8ff; --c-g: #5fd38d; --c-o: #ffa657; }
}
:root[data-theme="dark"] body[data-pal="scrub"] { --bg:#101a19; --grid:rgba(90,200,180,.06); --rail:#142120; --card:#192726; --back:#1c302d; --fg:#e2efec; --muted:#88a29e; --line:#283b39; --accent:#4cc7b4; --accent-soft:#1e3a36; --ok:#6cc58a; --ok-soft:#1d3526; --miss:#f07a6e; --hl:#6b5310; --star:#fb923c; --c-r: #ff7b72; --c-b: #79a8ff; --c-g: #5fd38d; --c-o: #ffa657; }
:root[data-theme="dark"] body[data-pal="navy"]  { --bg:#12141d; --grid:rgba(142,164,255,.05); --rail:#171a26; --card:#1c2030; --back:#222941; --fg:#e6e8f2; --muted:#9196ad; --line:#2d3247; --accent:#8ea4ff; --accent-soft:#283055; --ok:#6cc596; --ok-soft:#1f3529; --miss:#f07a6e; --hl:#6b5310; --star:#fb923c; --c-r: #ff7b72; --c-b: #79a8ff; --c-g: #5fd38d; --c-o: #ffa657; }
:root[data-theme="dark"] body[data-pal="amber"] { --bg:#18150f; --grid:rgba(240,165,74,.05); --rail:#1e1a13; --card:#241f17; --back:#2f271a; --fg:#f1ead9; --muted:#a89c82; --line:#3a3224; --accent:#f0a54a; --accent-soft:#3d3020; --ok:#6cc596; --ok-soft:#1f3529; --miss:#f07a6e; --hl:#6b5310; --star:#fb923c; --c-r: #ff7b72; --c-b: #79a8ff; --c-g: #5fd38d; --c-o: #ffa657; }

.pals { display: flex; gap: 6px; margin-top: 8px; }
.pal { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.pal[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.pal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pal[data-pal="scrub"] { background: #0e7a6d; }
.pal[data-pal="navy"] { background: #2f4bb8; }
.pal[data-pal="amber"] { background: #c47a12; }
.pal[data-pal="ecg"] { background: #b8323a; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
  color: var(--fg);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
}
button { font: inherit; color: inherit; }
kbd {
  font-family: var(--mono); font-size: 11px;
  padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; background: var(--card); color: var(--muted);
}

.app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }

/* ---------- rail ---------- */
.rail {
  background: var(--rail);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  min-height: 0;
}
.brand { padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.brand .sys { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--accent); }
.brand h1 { margin: 0; font-size: 20px; line-height: 1.2; }
.modes { display: flex; flex-direction: column; gap: 2px; padding: 0 10px 12px; }
.mode-btn {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  padding: 8px 10px; border: 0; border-radius: 7px; background: transparent;
  text-align: left; cursor: pointer; font-weight: 600;
}
.mode-btn small { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--muted); }
.mode-btn:hover { background: var(--accent-soft); }
.mode-btn[aria-current="true"] { background: var(--card); box-shadow: inset 3px 0 0 var(--accent); color: var(--accent); }
.mode-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.search { padding: 0 14px 10px; }
.search input {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--card); color: var(--fg); font: inherit; font-size: 14px;
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.cc-list { overflow-y: auto; padding: 0 10px 20px; flex: 1; min-height: 0; }
.cc-sys { margin: 12px 8px 4px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
.cc-item {
  display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
  width: 100%; padding: 5px 10px; border: 0; border-radius: 6px; background: transparent;
  cursor: pointer; text-align: left; font-size: 14px;
}
.cc-item small { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.cc-item:hover { background: var(--accent-soft); }
.cc-item[aria-current="true"] { background: var(--card); color: var(--accent); font-weight: 700; }
.cc-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rail-foot { padding: 10px 18px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* ---------- main ---------- */
.main { overflow-y: auto; min-width: 0; }
.stage { max-width: 1080px; margin: 0 auto; padding-inline: 32px; padding-block: 28px 60px; }
.view[hidden] { display: none !important; }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.head .kicker { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; color: var(--accent); }
.head h2 { margin: 2px 0 0; font-size: 34px; line-height: 1.15; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); cursor: pointer; font-size: 13px; font-weight: 600;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn.primary:hover { color: var(--card); filter: brightness(1.08); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* study grid */
.block { margin-bottom: 26px; }
.block-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.block-head h3 { margin: 0; font-size: 15px; }
.block-head span { font-size: 13px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

.flip { perspective: 1400px; cursor: pointer; border: 0; padding: 0; background: none; text-align: left; width: 100%; }
.flip:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
.inner { display: grid; transform-style: preserve-3d; transition: transform 0.42s ease; height: 100%; }
.flip.on .inner { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; min-height: 104px;
  display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0;
}
.front { background: var(--card); }
.back { background: var(--back); border-color: var(--accent-soft); transform: rotateY(180deg); }
.tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--accent); }
.q { font-size: 16px; font-weight: 600; }
.cc-name { font-size: 20px; font-weight: 700; line-height: 1.2; }
.ans { font-size: 15px; font-weight: 600; word-break: keep-all; overflow-wrap: anywhere; }
.ans.mn { font-size: 19px; font-weight: 700; letter-spacing: 0.03em; }
.ans ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 3px; }
.empty { color: var(--muted); }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); }
.pager button { border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 4px 0; }
.pager button:disabled { visibility: hidden; }

/* drill */
.settings { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin-bottom: 22px; }
.set-row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.set-row > b { font-size: 12px; color: var(--muted); width: 3.5em; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 4px 11px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--bg); cursor: pointer; font-size: 13px; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip:disabled { opacity: 0.4; cursor: default; }

.deck { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.progress { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 6px; }
.progress-top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress-top .ok { color: var(--ok); }
.progress-top .miss { color: var(--miss); }
.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .b-ok { background: var(--ok); }
.bar .b-miss { background: var(--miss); }

.big { max-width: 720px; }
.big .face { min-height: 300px; padding: 28px 34px; gap: 10px; }
.big .tag { font-size: 12px; }
.big .cc-name { font-size: 40px; }
.big .q { font-size: 20px; }
.big .ans { font-size: 20px; }
.big .ans.mn { font-size: 34px; }
.big .hint { font-size: 13px; color: var(--muted); }
.sys-label { font-size: 14px; color: var(--muted); font-weight: 600; }

.judge { display: flex; gap: 12px; }
.judge button {
  min-width: 150px; padding: 11px 18px; border-radius: 10px; cursor: pointer;
  font-weight: 700; font-size: 15px; border: 1px solid var(--line); background: var(--card);
  display: flex; justify-content: center; align-items: center; gap: 10px;
}
.judge .j-miss { color: var(--miss); }
.judge .j-ok { color: var(--ok); }
.judge .j-miss:hover { border-color: var(--miss); }
.judge .j-ok:hover { border-color: var(--ok); background: var(--ok-soft); }
.judge button:disabled { opacity: 0.35; cursor: default; }
.judge button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.keys { font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

.sum { margin: 0; display: grid; grid-template-columns: 6.5em 1fr; gap: 6px 14px; align-items: baseline; text-align: left; }
.sum dt { font-family: var(--mono); font-size: 11px; color: var(--accent); }
.sum dd { margin: 0; font-size: 14px; font-weight: 600; min-width: 0; word-break: keep-all; overflow-wrap: anywhere; }
.sum dd.mn { font-size: 16px; font-weight: 700; }
.big .back.scroll { justify-content: flex-start; overflow-y: auto; max-height: 520px; }

.done { max-width: 720px; width: 100%; text-align: center; padding: 34px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.done .score { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; }
.done .score small { font-size: 18px; color: var(--muted); font-weight: 600; }
.misslist { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 620px; }
.misslist li { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.cc-toggle { display: none; }
.set-wrap > summary { display: none; }
.touch-keys { display: none; }
.big.dragging .inner { transition: none; }
.big.sw-ok .face { box-shadow: 0 0 0 3px var(--ok); }
.big.sw-miss .face { box-shadow: 0 0 0 3px var(--miss); }
.big.sw-flip .face { box-shadow: 0 0 0 3px var(--accent); }
.sw-label { position: absolute; top: 14px; z-index: 2; font-weight: 700; font-size: 14px; padding: 3px 10px; border-radius: 999px; opacity: 0; pointer-events: none; }
.big { position: relative; touch-action: none; }
.big .back.scroll { touch-action: pan-y; }
.sw-label.l-later { left: 50%; transform: translateX(-50%); color: var(--accent); background: var(--accent-soft); }
.sw-label.l-undo { left: 50%; top: auto; bottom: 14px; transform: translateX(-50%); color: var(--fg); background: var(--line); }
.big.sw-later .l-later, .big.sw-undo .l-undo { opacity: 1; }
.big.sw-later .face, .big.sw-undo .face { box-shadow: 0 0 0 3px var(--accent); }
.minor { display: flex; gap: 18px; }
.minor button { border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 0; }
.minor button:hover { color: var(--accent); }
.minor button:disabled { opacity: .35; cursor: default; }
.sw-label.l-ok { right: 14px; color: var(--ok); background: var(--ok-soft); }
.sw-label.l-miss { left: 14px; color: var(--miss); background: var(--accent-soft); }
.big.sw-ok .l-ok, .big.sw-miss .l-miss { opacity: 1; }
#studyBody { touch-action: pan-y; }


/* ---- v3: 중요 표시 · 메모 · 편집 ---- */
mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.memo { margin-top: 6px; padding: 6px 9px; border-left: 3px solid var(--accent); background: var(--card); border-radius: 0 6px 6px 0; font-size: 12.5px; line-height: 1.5; color: var(--fg); font-weight: 500; text-align: left; }
.memo b { font-family: var(--mono); font-size: 10.5px; color: var(--accent); font-weight: 500; margin-right: 6px; letter-spacing: 0.04em; }
.memo div + div { margin-top: 2px; }
.big .memo { font-size: 14px; }
.ccmemo { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.ccmemo mark { color: var(--fg); }
.star { color: var(--star); font-weight: 700; }
.chip-star { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--star); border: 1px solid currentColor; border-radius: 999px; padding: 1px 9px; margin-left: 10px; vertical-align: middle; }
.legend { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: -8px 0 16px; }
.cardwrap { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cardwrap .flip .face { min-height: 104px; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 18px; }
.badge { font-family: var(--mono); font-size: 10px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.badge.added { background: var(--ok-soft); color: var(--ok); }
.linkbtn { border: 0; background: none; padding: 2px 0; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.linkbtn:hover, .linkbtn:focus-visible { color: var(--accent); outline: none; text-decoration: underline; }
.addbtn { border: 1px dashed var(--line); background: transparent; border-radius: 10px; min-height: 104px; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; }
.addbtn:hover, .addbtn:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
.editor { border: 1px solid var(--accent); border-radius: 10px; background: var(--card); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.editor .tag { display: block; }

    <div class="bar"><i class="b-ok" style="width:${pct(drill.ok)}"></i><i class="b-miss" style="width:${pct(drill.miss)}"></i></div></div>`;
  if (!n) {
    deck.innerHTML = `<div class="done"><strong>${mode === "wrong" ? "오답노트가 비어 있어." : "고른 범위에 문제가 없어."}</strong><span class="empty">${mode === "wrong" ? "퀴즈에서 몰랐음을 누르면 여기로 모여." : "계통이나 항목을 하나 이상 골라줘."}</span></div>`;
    return;
  }
  if (drill.pos >= n) {
    const missList = drill.missed.map(it => `<li>${esc(it.cc.name)}${it.field !== "throw" ? " · " + FIELD[it.field].short : ""}</li>`).join("");
    deck.innerHTML = prog + `<div class="done"><span class="empty">한 바퀴 끝</span>
      <div class="score">${drill.ok}<small> / ${n}</small></div>
      ${missList ? `<ul class="misslist">${missList}</ul>` : `<span>전부 알았음</span>`}
      <div class="tools">${drill.missed.length ? `<button class="btn primary" id="retryMissed">몰랐던 ${drill.missed.length}개 다시</button>` : ""}<button class="btn" id="again">처음부터 다시 섞기</button><button class="btn" id="jUndo">마지막 판정 되돌리기</button></div></div>`;
    return;
  }
  const it = q[drill.pos], fb = frontBack(it);
  deck.innerHTML = prog + `
    <button class="flip big${drill.flipped ? " on" : ""}" id="bigCard" type="button" style="width:100%"><span class="sw-label l-miss">몰랐음</span><span class="sw-label l-ok">알았음</span><span class="sw-label l-later">나중에 다시</span><span class="sw-label l-undo">되돌리기</span><div class="inner">
      <div class="face front">${fb.front}<span class="hint">${TOUCH ? "탭해서 뒤집기" : "스페이스로 뒤집기"}</span></div>
      <div class="face back${fb.scroll ? " scroll" : ""}">${fb.back}</div>
    </div></button>
    <div class="judge"><button class="j-miss" id="jMiss" ${drill.flipped ? "" : "disabled"}>몰랐음 <kbd>1</kbd></button><button class="j-ok" id="jOk" ${drill.flipped ? "" : "disabled"}>알았음 <kbd>2</kbd></button></div>
    <div class="minor"><button id="jLater" ${drill.queue.length - drill.pos > 1 ? "" : "disabled"}>나중에 다시</button><button id="jUndo" ${drill.hist.length ? "" : "disabled"}>되돌리기</button>${it.field !== "throw" ? `<button id="jEdit">이 카드 수정하러 가기</button>` : ""}</div>
    <div class="keys"><span><kbd>Space</kbd> 뒤집기</span><span><kbd>1</kbd> <kbd>←</kbd> 몰랐음</span><span><kbd>2</kbd> <kbd>→</kbd> 알았음</span><span><kbd>↑</kbd> 나중에 다시</span><span><kbd>↓</kbd> 되돌리기</span><span><kbd>R</kbd> 새로 섞기</span></div>
    <div class="touch-keys"><span>탭 뒤집기</span><span>→ 알았음</span><span>← 몰랐음</span><span>↑ 나중에 다시</span><span>↓ 되돌리기</span></div>`;
}
function flipBig() {
  if (!drill || drill.pos >= drill.queue.length) return;
  drill.flipped = !drill.flipped;
  $("#bigCard").classList.toggle("on", drill.flipped);
  $("#jMiss").disabled = $("#jOk").disabled = !drill.flipped;
}
function judge(ok) {
  if (!drill || !drill.flipped || drill.pos >= drill.queue.length) return;
  const it = drill.queue[drill.pos];
  drill.hist.push({ kind: ok ? "ok" : "miss", it, wasWrong: wrong.has(it.id) });
  if (ok) { drill.ok++; if (wrong.delete(it.id)) saveWrong(); }
  else { drill.miss++; drill.missed.push(it); wrong.add(it.id); saveWrong(); }
  drill.pos++; drill.flipped = false;
  renderDeck();
}
function later() {
  if (!drill || drill.pos >= drill.queue.length) return;
  if (drill.queue.length - drill.pos > 1) { const [it] = drill.queue.splice(drill.pos, 1); drill.queue.push(it); drill.hist.push({ kind: "later", it }); }
  drill.flipped = false; renderDeck();
}
function undo() {
  if (!drill || !drill.hist.length) return;
  const h = drill.hist.pop();
  if (h.kind === "later") { drill.queue.pop(); drill.queue.splice(drill.pos, 0, h.it); }
  else {
    drill.pos--;
    if (h.kind === "ok") drill.ok--; else { drill.miss--; drill.missed.pop(); }
    h.wasWrong ? wrong.add(h.it.id) : wrong.delete(h.it.id);
    saveWrong();
  }
  drill.flipped = true; renderDeck();
}

/* ---------- 백업 ---------- */
let panelMode = null;
function openPanel(kind) {
  panelMode = kind;
  $("#panel").hidden = false; $("#panelMsg").textContent = "";
  if (kind === "export") {
    $("#panelTitle").textContent = "수정 내역 백업";
    $("#panelDesc").textContent = "아래 내용을 복사해서 메모나 파일로 보관해. 다른 버전(HTML 파일 ↔ 링크)으로 옮길 때 '백업 불러오기'에 붙여넣으면 돼.";
    $("#panelText").value = JSON.stringify({ app: "cpx-cards", version: VERSION, edits: EDITS }, null, 1);
    $("#panelAct").textContent = "복사";
  } else {
    $("#panelTitle").textContent = "백업 불러오기";
    $("#panelDesc").textContent = "백업 내용을 붙여넣고 '합치기'를 누르면, 같은 카드는 백업 내용으로 바뀌고 나머지 수정은 그대로 남아.";
    $("#panelText").value = "";
    $("#panelAct").textContent = "합치기";
  }
  $("#panelText").focus();
}
async function panelAct() {
  if (panelMode === "export") {
    const t = $("#panelText");
    try { await navigator.clipboard.writeText(t.value); $("#panelMsg").textContent = "복사했어."; }
    catch { t.select(); $("#panelMsg").textContent = "선택해뒀어. 복사 단축키로 복사해줘."; }
    return;
  }
  let obj;
  try { obj = JSON.parse($("#panelText").value); } catch { $("#panelMsg").textContent = "백업 형식이 아니야. 내보내기로 복사한 내용을 그대로 붙여넣어줘."; return; }
  const n = mergeBackup(obj);
  $("#panelMsg").textContent = n < 0 ? "수정 내역이 들어 있지 않아." : `${n}개 CC의 수정 내역을 합쳤어.`;
}
function mergeBackup(obj) {
  const ed = obj && obj.edits; if (!ed || typeof ed !== "object") return -1;
  let n = 0;
  Object.entries(ed).forEach(([k, v]) => {
    const cc = CCS.find(c => c.key === k); if (!cc) return;
    const cur = edOf(cc);
    Object.assign(cur.cards = cur.cards || {}, v.cards || {});
    const ids = new Set((cur.added || []).map(a => a.id));
    (v.added || []).forEach(a => { if (!ids.has(a.id)) (cur.added = cur.added || []).push(a); });
    n++; save(cc);
  });
  render();
  return n;
}
/* ---------- 앱 모드: iCloud(파일 앱)로 저장 · 불러오기 ---------- */
function stamp() { const d = new Date(), p = x => String(x).padStart(2, "0"); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
async function saveToCloudFile() {
  const body = JSON.stringify({ app: "cpx-cards", version: VERSION, savedAt: new Date().toISOString(), edits: EDITS }, null, 1);
  const name = `CPX카드_수정내역_${stamp()}.json`;
  const file = new File([body], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "CPX 카드 수정 내역" });
      store.set("lastCloudSave", Date.now()); renderSync(); return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  store.set("lastCloudSave", Date.now()); renderSync();
}
function loadFromCloudFile() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try { const n = mergeBackup(JSON.parse(await f.text())); toast(n < 0 ? "수정 내역 파일이 아니야." : `${n}개 CC의 수정 내역을 불러왔어.`); }
    catch { toast("파일을 읽지 못했어. 저장했던 .json 파일을 골라줘."); }
  };
  inp.click();
}
function toast(msg) {
  let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- routing ---------- */
function render() {
  renderModes(); renderList(); renderSync();
  const study = mode === "study";
  $("#v-study").hidden = !study; $("#v-drill").hidden = study;
  if (study) renderStudy();
  else {
    const m = DRILL_META[mode];
    $("#drillKicker").textContent = onlyCC !== null && mode === "random" ? "이 CC만 퀴즈" : m.kicker;
    $("#drillTitle").textContent = onlyCC !== null && mode === "random" ? CCS[onlyCC].name : m.title;
    $("#drillDesc").textContent = m.desc;
    renderSettings(); startDrill();
  }
  saveUI();
}
function setMode(m) { if (m !== "random") onlyCC = null; mode = m; editing = null; render(); $("#main").scrollTop = 0; }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, .chip"); if (!t) return;
  if (t.dataset.fmt) { applyFmt(t.dataset.fmt); return; }
  if (t.closest(".editor") && t.dataset.act) { editorAction(t.dataset.act, t.closest(".editor")); return; }
  if (t.dataset.edit) { editing = { slot: t.dataset.edit }; renderStudy(); return; }
  if (t.dataset.add) { editing = { add: t.dataset.add }; renderStudy(); return; }
  if (t.dataset.undel) { const cc = CCS[curCC], e2 = edOf(cc), o = e2.cards[t.dataset.undel]; if (o) { delete o.del; if (!o.lines && !o.notes) delete e2.cards[t.dataset.undel]; } tidy(cc); save(cc); renderStudy(); renderList(); return; }
  if (t.id === "cloudSave") return saveToCloudFile();
  if (t.id === "cloudLoad") return loadFromCloudFile();
  if (t.id === "exportBtn") return openPanel("export");
  if (t.id === "importBtn") return openPanel("import");
  if (t.id === "panelClose") { $("#panel").hidden = true; return; }
  if (t.id === "panelAct") return panelAct();
  if (t.id === "jEdit") { const it = drill.queue[drill.pos]; curCC = it.cc.i; editing = { slot: it.id.split("|")[1] }; onlyCC = null; mode = "study"; render(); return; }
  if (t.classList.contains("pal")) { setPal(t.dataset.pal); return; }
  if (t.dataset.mode) { onlyCC = null; setMode(t.dataset.mode); return; }
  if (t.id === "ccToggle") { $(".rail").classList.toggle("open"); t.setAttribute("aria-expanded", $(".rail").classList.contains("open")); return; }
  if (t.dataset.cc) { curCC = +t.dataset.cc; onlyCC = null; $(".rail").classList.remove("open"); setMode("study"); return; }
  if (t.classList.contains("flip") && !t.classList.contains("big")) { t.classList.toggle("on"); return; }
  if (t.id === "bigCard") { flipBig(); return; }
  if (t.id === "jOk") return judge(true);
  if (t.id === "jMiss") return judge(false);
  if (t.id === "jLater") return later();
  if (t.id === "jUndo") return undo();
  if (t.id === "flipAll") { const cards = [...document.querySelectorAll("#studyBody .flip")]; const on = cards.some(c => !c.classList.contains("on")); cards.forEach(c => c.classList.toggle("on", on)); return; }
  if (t.id === "prevCC" && curCC > 0) { curCC--; editing = null; render(); return; }
  if (t.id === "nextCC" && curCC < CCS.length - 1) { curCC++; editing = null; render(); return; }
  if (t.id === "drillThis") { onlyCC = curCC; mode = "random"; render(); return; }
  if (t.id === "clearOnly") { onlyCC = null; render(); return; }
  if (t.id === "restart" || t.id === "again") { startDrill(); return; }
  if (t.id === "retryMissed") { drill = { queue: shuffle(drill.missed), pos: 0, flipped: false, ok: 0, miss: 0, missed: [], hist: [] }; renderDeck(); return; }
  if (t.id === "clearWrong") { wrong.clear(); saveWrong(); render(); return; }
  if (t.id === "impToggle") { prefs.random.impOnly = !prefs.random.impOnly; saveUI(); renderSettings(); startDrill(); return; }
  if (t.dataset.dir) { prefs.aonly.dir = t.dataset.dir; saveUI(); renderSettings(); startDrill(); return; }
  if (t.dataset.all) { const [k, f] = t.dataset.all.split("."); const all = f === "sys" ? SYSTEMS : FIELD_ORDER; prefs[k][f] = prefs[k][f].length === all.length ? [] : [...all]; saveUI(); renderSettings(); startDrill(); return; }
  if (t.dataset.set) {
    const [k, f] = t.dataset.set.split("."), v = t.dataset.val, arr = prefs[k][f];
    const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v);
    saveUI(); renderSettings(); startDrill(); return;
  }
});
$("#q").addEventListener("input", renderList);
document.addEventListener("input", e => { if (e.target.closest && e.target.closest(".editor")) updatePreview(); });
document.addEventListener("focusin", e => { if (e.target.id === "edLines" || e.target.id === "edNotes") lastTA = e.target.id; });
document.addEventListener("mousedown", e => { if (e.target.closest && e.target.closest(".fmtbtn")) e.preventDefault(); });
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { const first = $("#ccList .cc-item"); if (first) { first.click(); $("#q").blur(); } } });
document.addEventListener("keydown", e => {
  if (!$("#panel").hidden) { if (e.key === "Escape") $("#panel").hidden = true; return; }
  const box = e.target.closest && e.target.closest(".editor");
  if (box) {
    if (e.key === "Escape") { e.preventDefault(); editorAction("cancel", box); }
    else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); editorAction("save", box); }
    return;
  }
  if (e.target.matches("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === "/") { e.preventDefault(); $("#q").focus(); return; }
  if (mode === "study") {
    if (k === "ArrowLeft" && curCC > 0) { curCC--; editing = null; render(); }
    else if (k === "ArrowRight" && curCC < CCS.length - 1) { curCC++; editing = null; render(); }
    else if (k === "f" || k === "F") $("#flipAll").click();
    return;
  }
  if (k === " " || k === "Enter") { if (e.target.closest("button") && e.target.id !== "bigCard" && k === "Enter") return; e.preventDefault(); flipBig(); }
  else if (k === "1" || k === "ArrowLeft") judge(false);
  else if (k === "2" || k === "ArrowRight") judge(true);
  else if (k === "ArrowUp") { e.preventDefault(); later(); }
  else if (k === "ArrowDown" || k === "u" || k === "U") { e.preventDefault(); undo(); }
  else if (k === "r" || k === "R") startDrill();
});

const PALS = [["scrub", "수술복 그린"], ["navy", "네이비"], ["amber", "앰버"], ["ecg", "ECG 레드"]];
function setPal(p) {
  document.body.dataset.pal = p; store.set("pal", p);
  $("#pals").innerHTML = PALS.map(([id, name]) => `<button class="pal" data-pal="${id}" title="${name}" aria-label="${name} 테마" aria-pressed="${id === p}"></button>`).join("");
}
setPal(store.get("pal", "scrub"));
$("#verLabel").textContent = `v${VERSION} · ${BUILT}`;
const updFoot = () => { $("#railFoot").innerHTML = `${CCS.length} CC · ${ITEMS.length}문제 · <kbd>/</kbd> 검색`; };

/* ---------- swipe (touch) ---------- */
const TOUCH = matchMedia("(hover: none)").matches;
if (matchMedia("(max-width: 760px)").matches) $("#setWrap").open = false;
let sw = null, swallowClick = false;
const TH = 70;
document.addEventListener("touchstart", e => {
  if (e.touches.length !== 1 || e.target.closest(".editor")) return;
  const big = e.target.closest("#bigCard"), study = e.target.closest("#studyBody");
  if (!big && !(study && mode === "study")) return;
  sw = { x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, lock: null, big };
}, { passive: true });
document.addEventListener("touchmove", e => {
  if (!sw) return;
  const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
  if (sw.lock === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
    sw.lock = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (sw.lock === "y" && sw.big) {
      const sc = e.target.closest(".back.scroll");
      if (sc && drill.flipped && sc.scrollHeight > sc.clientHeight + 4) sw.lock = "scroll";
    }
  }
  if (sw.lock === "y" && sw.big) {
    e.preventDefault(); sw.dy = dy;
    const c = sw.big, far = Math.abs(dy) > TH;
    c.classList.add("dragging"); c.style.transform = `translateY(${dy * 0.6}px)`;
    c.classList.toggle("sw-later", far && dy < 0 && drill.queue.length - drill.pos > 1);
    c.classList.toggle("sw-undo", far && dy > 0 && drill.hist.length > 0);
    return;
  }
  if (sw.lock !== "x") return;
  e.preventDefault(); sw.dx = dx;
  if (sw.big) {
    const c = sw.big;
    c.classList.add("dragging"); c.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`;
    const far = Math.abs(dx) > TH;
    c.classList.toggle("sw-ok", far && drill.flipped && dx > 0);
    c.classList.toggle("sw-miss", far && drill.flipped && dx < 0);
    c.classList.toggle("sw-flip", far && !drill.flipped);
  } else {
    $("#studyBody").style.transform = `translateX(${dx / 3}px)`;
    $("#studyBody").style.opacity = String(1 - Math.min(Math.abs(dx) / 600, 0.4));
  }
}, { passive: false });
document.addEventListener("touchend", () => {
  if (!sw) return;
  const s = sw; sw = null;
  if (s.lock === "y" && s.big) {
    swallowClick = true; setTimeout(() => { swallowClick = false; }, 350);
    const c = s.big, dy = s.dy || 0;
    c.style.transition = "transform .2s ease"; c.style.transform = "";
    c.classList.remove("dragging", "sw-later", "sw-undo");
    if (dy < -TH) later(); else if (dy > TH) undo();
    return;
  }
  if (s.lock !== "x") return;
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 350);
  if (s.big) {
    const c = s.big, far = Math.abs(s.dx) > TH;
    if (far && drill.flipped) {
      c.style.transition = "transform .22s ease, opacity .22s ease";
      c.style.transform = `translateX(${s.dx > 0 ? 600 : -600}px) rotate(${s.dx > 0 ? 18 : -18}deg)`;
      c.style.opacity = "0";
      setTimeout(() => judge(s.dx > 0), 200);
      return;
    }
    c.style.transition = "transform .2s ease"; c.style.transform = "";
    c.classList.remove("dragging", "sw-ok", "sw-miss", "sw-flip");
    setTimeout(() => { c.style.transition = ""; }, 220);
    if (far && !drill.flipped) flipBig();
  } else {
    const b = $("#studyBody"); b.style.transform = ""; b.style.opacity = "";
    if (s.dx < -TH && curCC < CCS.length - 1) { curCC++; editing = null; render(); scrollTo(0, 0); }
    else if (s.dx > TH && curCC > 0) { curCC--; editing = null; render(); scrollTo(0, 0); }
  }
});
document.addEventListener("click", e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); swallowClick = false; } }, true);

const _renderModes = renderModes;
renderModes = function () { _renderModes(); updFoot(); };
render();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
